# Netlify build config for apps/demo.
#
# Netlify resolves `base` from the root of the deployed repo, so the build
# command uses `cd ../..` to run the workspace-level build via Turborepo.

[build]
base    = "apps/demo"
command = "cd ../.. && bun install --frozen-lockfile && bun run build --filter=@ccm-feedback/demo"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

[build.environment]
NODE_VERSION            = "20"
NEXT_TELEMETRY_DISABLED = "1"
